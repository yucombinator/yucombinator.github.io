name: Check In Motion framework

on:
  workflow_dispatch:
  push:
    paths:
      - "visualizations/**"
  pull_request:
    paths:
      - "visualizations/**"

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Static config contract
        run: python3 visualizations/tests/check_configs.py
      - name: Schedule payload contract
        run: python3 visualizations/tests/check_schedules.py
      - name: Assets stamped
        run: python3 visualizations/_shared/stamp_version.py --check
