name: Refresh GTFS snapshots — all cities

# Vancouver, Seattle, Calgary, Toronto and Ottawa are rebuilt after their
# local date rolls over. Busways are static OSM overlays and are not rebuilt
# here. San Francisco is skipped because its ACE/511 feed needs an API key.
on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gtfs-refresh
  cancel-in-progress: false

jobs:
  rebuild:
    name: Rebuild ${{ matrix.city }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        city: [vancouver-in-motion, seattle-in-motion, calgary-in-motion, ottawa-in-motion, toronto-in-motion]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Clear stale stops payloads
        run: rm -f visualizations/${{ matrix.city }}/stops-*.json
      - name: Rebuild the three service days
        run: python3 visualizations/${{ matrix.city }}/build/build_data.py
      - name: Check the snapshot is complete and current
        run: python3 visualizations/tests/check_snapshot.py --city ${{ matrix.city }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.city }}
          path: |
            visualizations/${{ matrix.city }}/data.json
            visualizations/${{ matrix.city }}/data-saturday.json
            visualizations/${{ matrix.city }}/data-sunday.json
            visualizations/${{ matrix.city }}/stops-*.json
            visualizations/${{ matrix.city }}/schedules/*.json
            visualizations/${{ matrix.city }}/live-trips.json
          if-no-files-found: error

  commit:
    name: Commit refreshed snapshots
    needs: rebuild
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Clear committed stops before merging artifacts
        run: |
          for city in vancouver-in-motion seattle-in-motion calgary-in-motion ottawa-in-motion toronto-in-motion; do
            rm -f "visualizations/$city"/stops-*.json
          done
      - name: Download Vancouver artifact
        uses: actions/download-artifact@v4
        with:
          name: vancouver-in-motion
          path: visualizations/vancouver-in-motion
      - name: Download Seattle artifact
        uses: actions/download-artifact@v4
        with:
          name: seattle-in-motion
          path: visualizations/seattle-in-motion
      - name: Download Calgary artifact
        uses: actions/download-artifact@v4
        with:
          name: calgary-in-motion
          path: visualizations/calgary-in-motion
      - name: Download Ottawa artifact
        uses: actions/download-artifact@v4
        with:
          name: ottawa-in-motion
          path: visualizations/ottawa-in-motion
      - name: Download Toronto artifact
        uses: actions/download-artifact@v4
        with:
          name: toronto-in-motion
          path: visualizations/toronto-in-motion
      # Re-check against the checkout we are about to commit on top of.
      - name: Re-validate downloaded snapshots
        run: |
          for city in vancouver-in-motion seattle-in-motion calgary-in-motion ottawa-in-motion toronto-in-motion; do
            python3 visualizations/tests/check_snapshot.py --city "$city"
          done
      - name: Validate route schedules
        run: |
          for city in vancouver-in-motion seattle-in-motion calgary-in-motion ottawa-in-motion toronto-in-motion; do
            python3 visualizations/tests/check_schedules.py --city "$city"
          done

      - name: Stamp the data version
        run: python3 visualizations/_shared/stamp_version.py
      - name: Commit if a snapshot changed
        run: |
          git config user.name "gtfs-refresh-bot"
          git config user.email "actions@users.noreply.github.com"
          git add visualizations/vancouver-in-motion/data*.json \
                  visualizations/vancouver-in-motion/stops-*.json \
                  'visualizations/vancouver-in-motion/schedules/*.json' \
                  visualizations/seattle-in-motion/data*.json \
                  visualizations/seattle-in-motion/stops-*.json \
                  'visualizations/seattle-in-motion/schedules/*.json' \
                  visualizations/calgary-in-motion/data*.json \
                  visualizations/calgary-in-motion/stops-*.json \
                  'visualizations/calgary-in-motion/schedules/*.json' \
                  visualizations/calgary-in-motion/live-trips.json \
                  visualizations/ottawa-in-motion/data*.json \
                  visualizations/ottawa-in-motion/stops-*.json \
                  'visualizations/ottawa-in-motion/schedules/*.json' \
                  visualizations/toronto-in-motion/data*.json \
                  visualizations/toronto-in-motion/stops-*.json \
                  'visualizations/toronto-in-motion/schedules/*.json' \
                  visualizations/_shared/version.js \
                  visualizations/*/index.html
          if git diff --cached --quiet; then
            echo "No data changes — skipping commit"
          else
            git commit -m "Refresh GTFS snapshots ($(date -u +%F))"
            git pull --rebase -X theirs origin main
            python3 visualizations/_shared/stamp_version.py
            git add visualizations/_shared/version.js visualizations/*/index.html
            git commit --amend --no-edit
            git push
          fi
