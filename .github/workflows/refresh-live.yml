# Live vehicle positions for Toronto in Motion.
#
# The GTFS-Realtime feeds send no CORS headers, so the page cannot read them
# directly. This job decodes them on a runner and force-pushes a one-file
# snapshot to the `live-data` branch, which raw.githubusercontent.com serves
# with CORS. The page polls that URL; keeping the snapshot off `main` means a
# five-minute cadence never triggers a Pages build (the legacy builder allows
# ~10 per hour).
#
# GitHub's shortest cron interval is 5 minutes and it is best-effort, so treat
# the snapshot age as "usually 5-15 minutes". The page hides the Live button
# once the snapshot is 30 minutes old rather than presenting stale data as live.
name: Refresh live vehicle positions

on:
  schedule:
    # Explicit minute list, five-minute cadence, offset from :00 (GitHub is
    # busiest at the top of the hour). Spelled out rather than */5 so the
    # schedule is unambiguous to every cron parser.
    - cron: "3,8,13,18,23,28,33,38,43,48,53,58 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# A scheduled run should never cancel one that is mid-push.
concurrency:
  group: live-refresh
  cancel-in-progress: false

jobs:
  snapshot:
    name: Snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch GTFS-Realtime vehicle positions
        run: python3 visualizations/toronto-in-motion/build/fetch_live.py

      # A feed outage returns valid-but-empty protobuf. Refuse to publish that,
      # otherwise the one bad run overwrites a good snapshot and the page loses
      # live mode until the next success.
      - name: Reject a thin or misdated snapshot
        run: |
          python3 - <<'PY'
          import json, sys, time
          d = json.load(open("visualizations/toronto-in-motion/live.json"))
          n = len(d.get("v") or [])
          feeds = d.get("feeds") or []
          age_ms = time.time() * 1000 - d.get("generated", 0)
          print(f"{n} vehicles across {len(feeds)} feeds, age {age_ms/1000:.0f}s")
          # TTC surface runs 24 hours, so it is the one feed that should
          # always answer; the 905 agencies legitimately drop to zero
          # vehicles in the small hours and must not fail the run.
          if "ttc" not in feeds:
              sys.exit(f"TTC feed missing, got: {feeds}")
          if n < 50:
              sys.exit(f"only {n} vehicles — the feeds are probably down")
          if not (0 <= age_ms <= 10 * 60 * 1000):
              sys.exit("snapshot timestamp is missing or out of range")
          PY

      # Force-push a single-commit orphan branch: the branch stays one file and
      # one commit forever, so a 5-minute cadence cannot bloat the repository.
      - name: Publish to the live-data branch
        run: |
          set -euo pipefail
          git config user.name "live-refresh-bot"
          git config user.email "actions@users.noreply.github.com"
          cp visualizations/toronto-in-motion/live.json /tmp/live.json
          git checkout --orphan live-publish
          git rm -rf . >/dev/null
          cp /tmp/live.json live.json
          git add live.json
          git commit -q -m "Live snapshot $(date -u +%FT%TZ)"
          git push -f origin HEAD:live-data
