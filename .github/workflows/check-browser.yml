name: Check In Motion browser UX

on:
  workflow_dispatch:
  push:
    paths:
      - "visualizations/**"
  pull_request:
    paths:
      - "visualizations/**"

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: visualizations/tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: visualizations/tests/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run deterministic browser suite
        run: npx playwright test --project=desktop --project=mobile --project=landscape
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            visualizations/tests/playwright-report
            visualizations/tests/test-results
          if-no-files-found: ignore
